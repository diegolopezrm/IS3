version: '3.9'

services:

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    networks:
      - micro-net

  consulta-service:
    build: ./consulta-service
    container_name: consulta-service
    ports:
      - "8082:8082"
    depends_on:
      - auth-service
    environment:
      # Dentro de la red de Docker hay que usar el nombre del servicio y su
      # puerto interno, no localhost: localhost dentro del contenedor es el
      # propio contenedor. Esta variable sobrescribe services.auth.url.
      SERVICES_AUTH_URL: http://auth-service:8081
    networks:
      - micro-net

networks:
  micro-net:
    driver: bridge
